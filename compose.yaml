services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - ${REPORT_SOURCE_HOST_PATH:-/Users/yucai/.hermes/profiles/tang_yu_heng/workspace}:/report-source:ro
    ports:
      - "${API_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy
      wecom-aibot:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - ${REPORT_SOURCE_HOST_PATH:-/Users/yucai/.hermes/profiles/tang_yu_heng/workspace}:/report-source:ro
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_started

  wecom-aibot:
    build: ./wecom-aibot
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      WECOM_AIBOT_BOT_ID: ${WECOM_AIBOT_BOT_ID}
      WECOM_AIBOT_SECRET: ${WECOM_AIBOT_SECRET}
      WECOM_AIBOT_INTERNAL_TOKEN: ${WECOM_AIBOT_INTERNAL_TOKEN}
    expose:
      - "8090"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
